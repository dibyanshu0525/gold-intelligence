name: Verify and package Gold Intelligence

on:
  push:
    branches:
      - fix/provider-and-retailer-prices
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package source ZIP
        run: |
          zip -r gold-intelligence-fixed.zip \
            backend frontend .env.example .gitignore README.md docker-compose.yml \
            -x "*/node_modules/*" "*/.venv/*" "*/__pycache__/*" "*/.pytest_cache/*" "*/dist/*"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-intelligence-fixed
          path: gold-intelligence-fixed.zip
          retention-days: 14
